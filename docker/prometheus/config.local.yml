global:
  scrape_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'gpool-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['gpool-api:3000']
  - job_name: 'notifications-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['notifications-api:8080']

rule_files:
  - /etc/prometheus/prometheus.rules.yml
  - /etc/prometheus/prometheus.alerts.yml
