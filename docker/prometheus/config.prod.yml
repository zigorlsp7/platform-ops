global:
  scrape_interval: 15s
  external_labels:
    environment: prod

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'gpool-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['gpool-api:3000']
  - job_name: 'notifications-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['notifications-api:8080']
  - job_name: 'kini-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['kini-api:3000']
  - job_name: 'cv-web'
    metrics_path: /metrics
    static_configs:
      - targets: ['cv-web:3001']
  - job_name: 'gpool-web'
    metrics_path: /metrics
    static_configs:
      - targets: ['gpool-web:3001']
  - job_name: 'kini-web'
    metrics_path: /metrics
    static_configs:
      - targets: ['kini-web:3001']
  # Host: disk, memory, CPU. Nothing else in the estate produces these.
  - job_name: 'node-exporter'
    metrics_path: /metrics
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: 'openbao'
    metrics_path: /v1/sys/metrics
    params:
      format: ['prometheus']
    static_configs:
      - targets: ['openbao:8200']
  # Redpanda's own metrics, for consumer lag and broker health.
  - job_name: 'redpanda'
    metrics_path: /public_metrics
    static_configs:
      - targets: ['platform-redpanda:9644']

rule_files:
  - /etc/prometheus/prometheus.rules.yml
  - /etc/prometheus/prometheus.alerts.yml
