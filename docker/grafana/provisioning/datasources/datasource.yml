apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    isDefault: false
    jsonData:
      implementation: prometheus
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    isDefault: false
    editable: false
    # A stable uid so the Loki datasource can link log lines to their trace.
    # Without it Grafana assigns a random one on every provision, and the
    # derived field in loki.yml would point at a datasource that no longer
    # exists after a restart.
    uid: jaeger
