name: platform-ops-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  jaeger:
    security_opt:
      - no-new-privileges:true
    image: jaegertracing/all-in-one:1.53
    restart: unless-stopped
    networks: [ops_shared]

  otel-collector:
    security_opt:
      - no-new-privileges:true
    image: otel/opentelemetry-collector:0.98.0
    restart: unless-stopped
    command: ['--config=/etc/otelcol/config.yml']
    volumes:
      - ./otel/config.yml:/etc/otelcol/config.yml:ro
    depends_on:
      - jaeger
    networks: [ops_shared]

  alertmanager:
    security_opt:
      - no-new-privileges:true
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./alertmanager/config.prod.yml:/etc/alertmanager/alertmanager.yml:ro
    networks: [ops_shared]

  prometheus:
    security_opt:
      - no-new-privileges:true
    image: prom/prometheus:v2.51.2
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus/config.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/prometheus.rules.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/prometheus.alerts.yml:ro
      - ops-prod-prometheus-data:/prometheus
    depends_on:
      - alertmanager
    networks: [ops_shared]

  grafana:
    security_opt:
      - no-new-privileges:true
    image: grafana/grafana:10.4.2
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ops-prod-grafana-data:/var/lib/grafana
      - ../docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks: [ops_shared]

  loki:
    security_opt:
      - no-new-privileges:true
    image: grafana/loki:2.9.8
    restart: unless-stopped
    command: ['-config.file=/etc/loki/config.yml']
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - ../docker/loki/config.yml:/etc/loki/config.yml:ro
      - ops-prod-loki-data:/loki
    networks: [ops_shared]

  tolgee:
    security_opt:
      - no-new-privileges:true
    image: tolgee/tolgee:v3.141.1
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      spring.config.additional-location: file:///config.yaml
      TOLGEE_AUTHENTICATION_ENABLED: true
      TOLGEE_AUTHENTICATION_REGISTRATIONS_ALLOWED: false
      TOLGEE_INITIAL_USERNAME: ${TOLGEE_INITIAL_USERNAME:?TOLGEE_INITIAL_USERNAME is required}
      TOLGEE_INITIAL_PASSWORD: ${TOLGEE_INITIAL_PASSWORD:?TOLGEE_INITIAL_PASSWORD is required}
      TOLGEE_JWT_SECRET: ${TOLGEE_JWT_SECRET:?TOLGEE_JWT_SECRET is required}
    volumes:
      - ops-prod-tolgee-data:/data
      - ./tolgee/config.yaml:/config.yaml:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || wget -qO- http://localhost:8080/api/healthz >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [ops_shared]

  openbao:
    security_opt:
      - no-new-privileges:true
    image: openbao/openbao:2.5.0
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    command: ['server', '-config=/openbao/config/prod.hcl']
    ports:
      - '127.0.0.1:8200:8200'
    volumes:
      - ../docker/openbao/prod.hcl:/openbao/config/prod.hcl:ro
      - ops-prod-openbao-data:/openbao/data
    networks: [ops_shared]

  redpanda:
    security_opt:
      - no-new-privileges:true
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.10
    restart: unless-stopped
    command:
      [
        'redpanda',
        'start',
        '--overprovisioned',
        '--smp',
        '1',
        '--memory',
        '1G',
        '--reserve-memory',
        '0M',
        '--check=false',
        '--node-id',
        '0',
        '--kafka-addr',
        'INTERNAL://0.0.0.0:9092',
        '--advertise-kafka-addr',
        'INTERNAL://platform-redpanda:9092',
        '--set',
        'redpanda.auto_create_topics_enabled=true',
      ]
    volumes:
      - ops-prod-redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD-SHELL', "rpk cluster health | grep -Eq 'Healthy:[[:space:]]+true'"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      ops_shared:
        aliases:
          - platform-redpanda

  central-ingress:
    security_opt:
      - no-new-privileges:true
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      GPOOL_WEB_DOMAIN: ${GPOOL_WEB_DOMAIN}
      GPOOL_API_DOMAIN: ${GPOOL_API_DOMAIN}
      KINI_WEB_DOMAIN: ${KINI_WEB_DOMAIN}
      KINI_API_DOMAIN: ${KINI_API_DOMAIN}
      CV_WEB_DOMAIN: ${CV_WEB_DOMAIN}
      OPS_GRAFANA_DOMAIN: ${OPS_GRAFANA_DOMAIN}
      OPS_TOLGEE_DOMAIN: ${OPS_TOLGEE_DOMAIN}
      OPS_OPENBAO_DOMAIN: ${OPS_OPENBAO_DOMAIN}
    volumes:
      - ./caddy/Caddyfile.ops.ingress.prod:/etc/caddy/Caddyfile:ro
      - ops-prod-caddy-data:/data
      - ops-prod-caddy-config:/config
    depends_on:
      - grafana
      - tolgee
      - openbao
    networks: [ops_shared]

  alloy:
    security_opt:
      - no-new-privileges:true
    image: grafana/alloy:v1.12.0
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ops-local-alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    networks: [ops_shared]

  # Host metrics. Without this there is no disk, memory or CPU signal at all —
  # and a full disk has already taken Tolgee down twice in this estate.
  # `--path.rootfs=/host` plus the read-only bind is the documented way to see
  # the host's filesystems from inside a container.
  node-exporter:
    security_opt:
      - no-new-privileges:true
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      # Collect only real disk filesystems. Without this, the container runtime's
      # own plumbing (virtiofs, fakeowner, erofs, fuse bridges) arrives as two
      # dozen series all describing the same single disk.
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|erofs|fusectl|fuse\..*|fakeowner|selfowner|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|tmpfs|virtiofs.*)$$
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [ops_shared]

networks:
  ops_shared:
    name: platform_ops_shared
    external: true

volumes:
  ops-prod-prometheus-data:
  ops-prod-grafana-data:
  ops-prod-loki-data:
  ops-prod-tolgee-data:
  ops-prod-openbao-data:
  ops-prod-redpanda-data:
  ops-prod-caddy-data:
  ops-prod-caddy-config:
  ops-local-alloy-data:
