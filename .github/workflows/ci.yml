name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run tells you about a commit nobody is waiting on, while
# holding a runner the current commit needs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'

# platform-ops holds the estate's shared infrastructure — compose files,
# Terraform, shell scripts and the observability kit that every other repo
# vendors. It had no CI at all, which meant the kit could break its own tests
# and the drift check could go red without anyone finding out until the next
# time someone ran it by hand.
jobs:
  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Format
        run: npm run format:check

      # Backs both the fmt-check below and the two validate steps further down.
      # Neither needs credentials or a backend, so the default (latest)
      # version satisfies every module's `>= 1.6.0` with nothing further to
      # configure.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      # Not check:hooks: that also runs check:secrets, which shells out to a
      # gitleaks binary present on a dev machine via brew but not on this
      # runner. Secrets scanning already has its own job below with a proper
      # install step — running it a second time here would be both redundant
      # and broken.
      - name: Shell, workflow, compose and Terraform checks
        run: npm run check:shell && npm run check:workflows && npm run check:compose && npm run check:terraform

      - name: Terraform validate (bootstrap)
        run: |
          terraform -chdir=infra/terraform/bootstrap init -backend=false -input=false
          terraform -chdir=infra/terraform/bootstrap validate

      - name: Terraform validate (aws-compose)
        run: |
          terraform -chdir=infra/terraform/aws-compose init -backend=false -input=false
          terraform -chdir=infra/terraform/aws-compose validate

      - name: Typecheck the observability kit
        run: npm run typecheck

      - name: Observability kit tests
        run: npm test

      - name: Deploy script helper tests
        run: npm run test:shell

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.99.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Scan
        run: |
          semgrep scan \
            --config p/default \
            --config p/secrets \
            --config p/terraform \
            --exclude-rule dockerfile.security.missing-user.missing-user \
            --exclude-rule dockerfile.security.missing-user-entrypoint.missing-user-entrypoint \
            --exclude-rule yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service \
            --exclude-rule yaml.docker-compose.security.no-new-privileges.no-new-privileges \
            --exclude-rule bash.lang.security.ifs-tampering.ifs-tampering \
            --exclude-rule generic.secrets.security.detected-generic-secret.detected-generic-secret \
            --exclude-rule javascript.lang.security.audit.prototype-pollution.prototype-pollution-loop.prototype-pollution-loop \
            --exclude-rule javascript.lang.security.audit.incomplete-sanitization.incomplete-sanitization \
            --exclude-rule javascript.lang.security.audit.detect-non-literal-regexp.detect-non-literal-regexp \
            --exclude-rule terraform.aws.security.aws-subnet-has-public-ip-address.aws-subnet-has-public-ip-address \
            --error \
            --metrics=off
