name: Uptime Probe

# External blackbox probe.
#
# Every other alert in the estate is generated by Prometheus, which runs on the
# same host as the things it watches. That is a monitoring system that cannot
# report its own death: if the host goes, so does the alerting, and the silence
# looks exactly like everything being fine.
#
# This runs on GitHub's infrastructure, from outside, and checks the public
# health endpoints the way a user's browser would. It is the only signal that
# survives the host disappearing.
#
# It opens an issue rather than sending mail, deliberately: an issue is
# deduplicated, has a state, and does not depend on the SMTP relay — which is
# itself part of what could be broken.

on:
  schedule:
    # Every five minutes. Note that GitHub delays scheduled runs under load and
    # skips them outright on a busy account, so treat this as "roughly every
    # five minutes" and never as a precise heartbeat.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: uptime-probe
  cancel-in-progress: true

jobs:
  probe:
    name: Probe public endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        if: vars.AWS_PROBE_ROLE_ARN != ''
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_PROBE_ROLE_ARN }}

      - name: Read the host's power state
        id: host
        if: vars.AWS_PROBE_ROLE_ARN != ''
        run: |
          set -euo pipefail

          read -r instance_id state launch_time reason < <(
            aws ec2 describe-instances \
              --filters Name=tag:Project,Values=platform-ops Name=tag:Environment,Values=prod Name=tag:Name,Values=platform-ops-prod-app-host \
              --query 'Reservations[].Instances[] | [0].[InstanceId,State.Name,LaunchTime,StateReason.Code]' \
              --output text
          )

          skip="false"
          failure=""

          if [ -z "$state" ] || [ "$instance_id" = "None" ]; then
            state="missing"
          fi

          case "$state" in
            running)
              uptime_seconds=$(( $(date -u +%s) - $(date -u -d "$launch_time" +%s) ))
              if [ "$uptime_seconds" -lt 600 ]; then
                skip="true"
                echo "::notice::$instance_id started ${uptime_seconds}s ago; letting the services come up before probing"
              fi
              ;;
            pending)
              skip="true"
              echo "::notice::$instance_id is starting; skipping this run"
              ;;
            stopping|stopped)
              if [ "$reason" = "Client.UserInitiatedShutdown" ]; then
                skip="true"
                echo "::notice::$instance_id is powered off on purpose; skipping this run"
              else
                failure="- **host** — $instance_id is $state ($reason), and nobody asked for that\n"
                echo "::error::$instance_id is $state ($reason)"
              fi
              ;;
            *)
              failure="- **host** — the prod host is $state\n"
              echo "::error::the prod host is $state"
              ;;
          esac

          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          {
            echo "failure<<HOST_EOF"
            printf '%s' "$failure"
            echo ""
            echo "HOST_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Probe
        id: probe
        if: steps.host.outputs.skip != 'true'
        env:
          HOST_FAILURE: ${{ steps.host.outputs.failure }}
          # Set as repository variables, not secrets: they are public hostnames
          # and a probe that cannot be read is a probe nobody trusts.
          GPOOL_API_DOMAIN: ${{ vars.GPOOL_API_DOMAIN }}
          GPOOL_WEB_DOMAIN: ${{ vars.GPOOL_WEB_DOMAIN }}
          OPS_GRAFANA_DOMAIN: ${{ vars.OPS_GRAFANA_DOMAIN }}
        run: |
          set -uo pipefail

          failures="${HOST_FAILURE:-}"

          probe_health() {
            local name="$1"
            local url="$2"
            local body
            local code
            local status

            if [ -z "${url#https://}" ] || [ "$url" = "https://" ]; then
              echo "::notice::$name has no domain configured, skipping"
              return 0
            fi

            # --max-time bounds the whole request. A hung TLS handshake is a
            # failure, not something to wait out.
            body="$(curl -sS --max-time 15 --write-out '\n%{http_code}' "$url" 2>&1)" || {
              failures="${failures}- **${name}** — no response from \`${url}\`\n"
              echo "::error::$name unreachable"
              return 0
            }

            code="$(printf '%s' "$body" | tail -n1)"
            body="$(printf '%s' "$body" | sed '$d')"

            if [ "$code" != "200" ]; then
              failures="${failures}- **${name}** — HTTP ${code} from \`${url}\`\n"
              echo "::error::$name returned $code"
              return 0
            fi

            # A 200 is not enough. The health endpoint returns 200 while
            # degraded, which is the whole reason `service_health_status`
            # exists — so read the status field rather than trusting the code.
            status="$(printf '%s' "$body" | jq -r '.status // "unparseable"' 2>/dev/null || echo unparseable)"

            case "$status" in
              ok)
                echo "::notice::$name ok"
                ;;
              degraded)
                failures="${failures}- **${name}** — reports \`degraded\`: outbound email is probably not being queued\n"
                echo "::warning::$name degraded"
                ;;
              *)
                failures="${failures}- **${name}** — reports \`${status}\`\n"
                echo "::error::$name reports $status"
                ;;
            esac
          }

          probe_page() {
            local name="$1"
            local url="$2"
            local code

            if [ -z "${url#https://}" ] || [ "$url" = "https://" ]; then
              echo "::notice::$name has no domain configured, skipping"
              return 0
            fi

            code="$(curl -sS --max-time 15 -o /dev/null --write-out '%{http_code}' "$url")" || {
              failures="${failures}- **${name}** — no response from \`${url}\`\n"
              echo "::error::$name unreachable"
              return 0
            }

            if [ "$code" != "200" ]; then
              failures="${failures}- **${name}** — HTTP ${code} from \`${url}\`\n"
              echo "::error::$name returned $code"
            else
              echo "::notice::$name ok"
            fi
          }

          probe_health "gpool-api" "https://${GPOOL_API_DOMAIN}/health"
          probe_page   "gpool-web" "https://${GPOOL_WEB_DOMAIN}/"
          probe_page   "grafana"   "https://${OPS_GRAFANA_DOMAIN}/api/health"

          {
            echo "failures<<PROBE_EOF"
            printf '%b' "$failures"
            echo "PROBE_EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Open or update an issue
        if: steps.probe.outputs.failures != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          FAILURES: ${{ steps.probe.outputs.failures }}
        with:
          script: |
            const title = 'Uptime probe: public endpoints failing';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The external uptime probe could not confirm the estate is healthy.',
              '',
              process.env.FAILURES,
              '',
              'This probe runs on GitHub, not on the ops host, so it still reports when the host itself is gone.',
              '',
              `[Probe run](${run}) · [Runbooks](../tree/main/docs/runbooks)`,
            ].join('\n');

            // One issue, reopened and commented on, rather than one per run.
            // A probe that files 288 issues a day is a probe you mute.
            const existing = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'all',
              labels: 'uptime',
              per_page: 20,
            });
            const open = existing.data.find((i) => i.title === title);

            if (!open) {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['uptime'] });
              return;
            }

            if (open.state === 'closed') {
              await github.rest.issues.update({ ...context.repo, issue_number: open.number, state: 'open' });
            }
            await github.rest.issues.createComment({ ...context.repo, issue_number: open.number, body });

      - name: Close the issue when everything is healthy
        if: steps.host.outputs.skip != 'true' && steps.probe.outputs.failures == ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const title = 'Uptime probe: public endpoints failing';
            const open = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: 'uptime',
              per_page: 20,
            });
            const issue = open.data.find((i) => i.title === title);
            if (issue) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: 'All probed endpoints are healthy again. Closing.',
              });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' });
            }
